<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚌 Multi-Platform Bus Fare Aggregator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1e293b;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-search {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .loading {
            text-align: center;
            color: white;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow-x: auto;
        }

        .results-title {
            font-size: 1.5em;
            color: #1e293b;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #1e293b;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #e2e8f0;
        }

        .best-price {
            color: #059669;
            font-weight: 600;
        }

        .cheapest-platform {
            display: inline-block;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .no-results {
            text-align: center;
            color: #64748b;
            padding: 40px 20px;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 0.9em;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚌 Bus Fare Aggregator</h1>
            <p>Compare prices across all major booking platforms</p>
        </div>

        <div class="search-card">
            <form class="search-form" id="searchForm">
                <div class="form-group">
                    <label for="origin">From</label>
                    <select id="origin" required>
                        <option value="">Select Origin</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Coimbatore">Coimbatore</option>
                        <option value="Hyderabad">Hyderabad</option>
                        <option value="Mumbai">Mumbai</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="destination">To</label>
                    <select id="destination" required>
                        <option value="">Select Destination</option>
                        <option value="Coimbatore">Coimbatore</option>
                        <option value="Chennai">Chennai</option>
                        <option value="Bengaluru">Bengaluru</option>
                        <option value="Madurai">Madurai</option>
                        <option value="Kochi">Kochi</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>

                <button type="submit" class="btn-search">🔍 Search</button>
            </form>
        </div>

        <div id="resultsArea"></div>
    </div>

    <script>
        // Set today's date as default
        document.getElementById('date').valueAsDate = new Date();

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>Fetching live prices...</p></div>';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ origin, destination, date })
                });

                const results = await response.json();

                if (results.length === 0) {
                    resultsArea.innerHTML = '<div class="results-container"><div class="no-results">No buses found for this route.</div></div>';
                    return;
                }

                let html = `<div class="results-container">
                    <div class="results-title">✈️ Fare Comparison: ${origin} → ${destination} (${date})</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Operator</th>
                                <th>Bus Type</th>
                                <th>Time</th>
                                <th>Rating</th>
                                <th>RedBus</th>
                                <th>AbhiBus</th>
                                <th>MakeMyTrip</th>
                                <th class="best-price">Best Price</th>
                                <th>Platform</th>
                            </tr>
                        </thead>
                        <tbody>`;

                results.forEach(bus => {
                    html += `<tr>
                        <td>${bus.operator}</td>
                        <td>${bus.bus_type}</td>
                        <td>${bus.departure} ➔ ${bus.arrival}</td>
                        <td>${bus.rating}</td>
                        <td>${bus.redbus}</td>
                        <td>${bus.abhibus}</td>
                        <td>${bus.makemytrip}</td>
                        <td class="best-price">${bus.best_price}</td>
                        <td><span class="cheapest-platform">${bus.cheapest_platform}</span></td>
                    </tr>`;
                });

                html += '</tbody></table></div>';
                resultsArea.innerHTML = html;

            } catch (error) {
                resultsArea.innerHTML = `<div class="results-container"><div class="error">Error fetching results: ${error.message}</div></div>`;
            }
        });
    </script>
</body>
</html>
